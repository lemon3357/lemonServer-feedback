name: 🐛 Bug 反馈
description: 反馈游戏中遇到的报错、异常或不正常的行为
title: "[Bug] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，方便我快速定位问题~
  - type: input
    id: player
    attributes:
      label: 游戏内 ID / 昵称
      placeholder: 例如：柠檬
    validations:
      required: false
  - type: input
    id: when
    attributes:
      label: 发生时间
      description: 大概的日期和时间，方便对照服务器日志
      placeholder: 例如：2026-09-26 20:30 左右
    validations:
      required: false
  - type: input
    id: server
    attributes:
      label: 所在服务器 / 模式
      placeholder: 例如：生存服 / PVP / 某张地图
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？出现了什么异常？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 怎样操作能再次触发这个问题？
      placeholder: |
        1. 进入 ……
        2. 使用 ……
        3. 出现 ……
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望的正常表现
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 报错信息
      description: 可以直接把图片拖进来
    validations:
      required: false
